<!doctype html>
<html lang="en" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07060d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Neon Drift: a one-thumb neon drifting arcade game with 60 stages and an endless mode. Plays offline." />
    <!-- Inlined, so the page makes no request at all for its tab icon. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307060d'/%3E%3Cpath d='M10 50 C 24 50 30 40 32 30 C 34 20 40 14 54 14' fill='none' stroke='%23ff3fa4' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M10 40 C 22 40 26 32 28 24' fill='none' stroke='%2337e2ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Neon Drift</title>
    <style>
      /* Painted before any script runs, so the first frame is already the game's colours. */
      html, body { margin: 0; background: #07060d; }
      #splash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; background: #07060d; color: #f2eeff; font: 800 40px/1 system-ui, sans-serif;
        letter-spacing: 0.04em; text-transform: uppercase; text-align: center; padding: 24px; }
      #splash b { color: #ff3fa4; font-weight: 800; }
      #splash small { font: 600 13px/1 system-ui, sans-serif; letter-spacing: 0.3em; color: #8d86a8; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game" role="region" aria-label="Playfield"></div>
      <div id="ui" class="ui"></div>
      <div id="live" class="sr-only" role="status" aria-live="polite"></div>
      <div id="splash"><span>Neon <b>Drift</b></span><small>LOADING</small></div>
      <noscript>Neon Drift needs JavaScript to run.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
